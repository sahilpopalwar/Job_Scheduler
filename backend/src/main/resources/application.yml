spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:jobscheduler;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
server:
  port: 8080
jwt:
  secret: ThisIsAProductionGradeJWTSecretKeyForLocalDevOnly_2026_ChangeLater
  expirationMs: 3600000
logging:
  level:
    root: INFO
    org.springframework: INFO
