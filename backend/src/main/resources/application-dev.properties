# Development profile - use in-memory H2 database
spring.datasource.url=jdbc:h2:mem:jobscheduler;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Optional: lower logging noise for dev
logging.level.org.springframework=INFO
logging.level.com.example=DEBUG
jwt.secret=ThisIsAProductionGradeJWTSecretKeyForLocalDevOnly_2026_ChangeLater
jwt.expirationMs=3600000
